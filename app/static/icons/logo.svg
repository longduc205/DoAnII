<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circles -->
  <circle cx="256" cy="256" r="220" stroke="url(#purpleGradient)" stroke-width="3" fill="none" opacity="0.3"/>
  <circle cx="256" cy="256" r="190" stroke="url(#purpleGradient)" stroke-width="3" fill="none" opacity="0.4"/>
  <circle cx="256" cy="256" r="160" stroke="url(#purpleGradient)" stroke-width="3" fill="none" opacity="0.5"/>
  <circle cx="256" cy="256" r="130" stroke="url(#purpleGradient)" stroke-width="3" fill="none" opacity="0.6"/>
  <circle cx="256" cy="256" r="100" stroke="url(#purpleGradient)" stroke-width="3" fill="none" opacity="0.7"/>
  <circle cx="256" cy="256" r="70" stroke="url(#purpleGradient)" stroke-width="3" fill="none" opacity="0.8"/>
  
  <!-- Center circle -->
  <circle cx="256" cy="256" r="40" stroke="url(#purpleGradient)" stroke-width="4" fill="none"/>
  <circle cx="256" cy="256" r="15" fill="url(#purpleGradient)"/>
  
  <!-- Crosshair lines -->
  <line x1="256" y1="36" x2="256" y2="476" stroke="url(#purpleGradient)" stroke-width="2" opacity="0.5"/>
  <line x1="36" y1="256" x2="476" y2="256" stroke="url(#purpleGradient)" stroke-width="2" opacity="0.5"/>
  
  <!-- Radar sweep line -->
  <line x1="256" y1="256" x2="256" y2="76" stroke="url(#purpleGradient)" stroke-width="3">
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="rotate"
      from="0 256 256"
      to="360 256 256"
      dur="4s"
      repeatCount="indefinite"/>
  </line>
  
  <!-- Data points on circles -->
  <circle cx="256" cy="76" r="8" fill="#7c3aed"/>
  <circle cx="436" cy="256" r="8" fill="#a855f7"/>
  <circle cx="256" cy="436" r="8" fill="#c084fc"/>
  <circle cx="76" cy="256" r="8" fill="#7c3aed"/>
  
  <circle cx="346" cy="166" r="6" fill="#a855f7"/>
  <circle cx="346" cy="346" r="6" fill="#c084fc"/>
  <circle cx="166" cy="346" r="6" fill="#7c3aed"/>
  <circle cx="166" cy="166" r="6" fill="#a855f7"/>
  
  <circle cx="406" cy="166" r="5" fill="#c084fc" opacity="0.7"/>
  <circle cx="406" cy="346" r="5" fill="#7c3aed" opacity="0.7"/>
  <circle cx="106" cy="346" r="5" fill="#a855f7" opacity="0.7"/>
  <circle cx="106" cy="166" r="5" fill="#c084fc" opacity="0.7"/>
  
  <circle cx="316" cy="106" r="4" fill="#7c3aed" opacity="0.6"/>
  <circle cx="406" cy="256" r="4" fill="#a855f7" opacity="0.6"/>
  <circle cx="316" cy="406" r="4" fill="#c084fc" opacity="0.6"/>
  <circle cx="106" cy="256" r="4" fill="#7c3aed" opacity="0.6"/>
</svg>
