<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-integrated Web Vulnerability Scanner - Educational Prototype">
    <title>{% block title %}AI-SCAN{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <a href="{{ url_for('main.index') }}" class="sidebar-logo">
                🛡️ AI-SCAN
            </a>
            <ul class="sidebar-nav">
                <li>
                    <a href="{{ url_for('main.index') }}"
                       class="{% if request.endpoint == 'main.index' %}active{% endif %}">
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('scan.new_scan') }}"
                       class="{% if request.endpoint and 'scan' in request.endpoint %}active{% endif %}">
                        New Scan
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('history.scan_history') }}"
                       class="{% if request.endpoint in ['history.scan_history', 'results.show_results'] %}active{% endif %}">
                        History
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Page Header -->
            <header class="page-header">
                <h1>{% block page_title %}Dashboard{% endblock %}</h1>
                <div class="page-header-right">
                    {% block header_right %}{% endblock %}
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
